[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabmaster"
version = "1.0.0"
description = "Spaced Repetition & Multilingual Vocabulary Management Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "openpyxl>=3.1.0",
    "pyjwt>=2.8.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "pg8000>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vocabmaster = "vocabmaster.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
include = ["vocabmaster*"]
